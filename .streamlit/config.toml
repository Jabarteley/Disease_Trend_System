# Locked light theme, colors taken directly from the reference design
# (Material 3-style tokens: teal primary, near-white surface, red error, indigo tertiary).

[theme]
base = "light"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

primaryColor = "#00685F"
backgroundColor = "#FAF8FF"
secondaryBackgroundColor = "#F2F3FF"
codeBackgroundColor = "#F2F3FF"
textColor = "#131B2E"
linkColor = "#00685F"
borderColor = "#DAE2FD"
codeTextColor = "#334155"
greenColor = "#00685F"
redColor = "#BA1A1A"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#4B41E1"
violetColor = "#4B41E1"
grayColor = "#515F74"
chartCategoricalColors = [
    "#00685F",
    "#BA1A1A",
    "#4B41E1",
    "#D97706",
    "#0284C7",
    "#64748B",
    "#EA580C",
    "#7C3AED",
]
dataframeBorderColor = "#DAE2FD"
dataframeHeaderBackgroundColor = "#F2F3FF"
dataframeHeaderTextColor = "#131B2E"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F3FF"
textColor = "#131B2E"
borderColor = "#DAE2FD"
primaryColor = "#00685F"
linkColor = "#00685F"
paddingTop = "0.5rem"
paddingBottom = "1.5rem"
